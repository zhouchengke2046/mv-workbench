name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev deps
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest
      - name: Secret scan
        run: python scripts/check_secrets.py
      - name: Build demo
        run: python scripts/build_workbench.py --data demo/data.json --out demo/workbench.ci.html
      - name: JS syntax
        run: node --check scripts/mv_keys_ui.js
      - name: Windows installer smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install.ps1 -Target "$env:RUNNER_TEMP\skills" -Bin "$env:RUNNER_TEMP\bin"
          & "$env:RUNNER_TEMP\bin\mvwb.cmd" doctor
      - name: Ruff
        run: python -m ruff check scripts tests
