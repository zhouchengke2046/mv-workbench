name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.11"
          - os: macos-latest
            python: "3.9"
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev deps
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest
      - name: Secret scan
        run: python dev/check_secrets.py
      - name: Build demo
        run: python scripts/build_workbench.py --data demo/data.json --out demo/workbench.ci.html
      - name: Demo refs check
        run: python scripts/mvwb.py check --data demo/data.json --workbench demo/workbench.ci.html
      - name: Windows installer smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install.ps1 -Target "$env:RUNNER_TEMP\skills" -Bin "$env:RUNNER_TEMP\bin"
          & "$env:RUNNER_TEMP\bin\mvwb.cmd" doctor
      - name: Ruff
        run: python -m ruff check scripts tests
